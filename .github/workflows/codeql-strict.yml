name: RFOF Strict CodeQL Control

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-strict:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Kontroll-Repo
        uses: actions/checkout@v4

      - name: Python-Monolithen temporär für CodeQL einbinden
        uses: actions/checkout@v4
        with:
          repository: RFOF-NETWORK/Python-polyglotten-Monolithen-prime-Multiplikation-Base
          token: ${{ secrets.GITHUB_TOKEN }}
          path: src/external-monolith

      - name: Initialize CodeQL Strict Mode
        uses: github/codeql-action/init@v4
        with:
          languages: 'python'
          queries: security-extended

      - name: Perform Strict Analysis
        uses: github/codeql-action/analyze@v4
